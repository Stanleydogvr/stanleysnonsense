<!DOCTYPE html>
<html>
<head>
    <title>Stanley's Nonsense</title>

    <style>
        body {
            background-color: grey;
            color: red;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            font-size: 75px;
        }

        p {
            font-size: 20px;
        }

        img {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 500px;
            cursor: pointer;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
        }
    </style>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>Stanley's Nonsense</h1>

    <img src="stanley.png" alt="Stanley" onclick="playStanley()">

    <p>Welcome to the site where i mess around with code :P</p>

    <button onclick="doSomething()">PRESS FOR FUN >:)</button>

    <p id="message">Nothing has happened yet...</p>

    <p id="visitorCount">Loading visitors...</p>

    <script>
        function doSomething() {
            const messages = [
                "You pressed the button. Congratulations. :P",
                "Whats up my flipin' cabbadges",
                "Stanley is a dog!",
                "You are almost there...",
                "ERROR_CODE: 67!",
                "You have summoned 101010010101.",
                "The button is now happy.",
                "Please stop."
            ];

            const randomMessage =
                messages[Math.floor(Math.random() * messages.length)];

            document.getElementById("message").textContent = randomMessage;
        }

        function playStanley() {
            const sound = new Audio("stanley.mp3");
            sound.play();
        }


        // =========================
        // VISITOR COUNTER
        // =========================

        const SUPABASE_URL =
            "https://istpywpkauuoqwpycxuy.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_qeA9KzmFhq112KUGfaPzBg_0ylWXkyV";

        const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function countVisitor() {
            const { data, error } =
                await supabase.rpc("increment_visitors");

            if (error) {
                console.error("Visitor counter error:", error);

                document.getElementById("visitorCount").textContent =
                    "Visitors: ???";

                return;
            }

            document.getElementById("visitorCount").textContent =
                "Visitors: " + data;
        }

        countVisitor();
    </script>

</body>
</html>
